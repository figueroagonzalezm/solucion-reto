# Test configuration: in-memory H2 (PostgreSQL mode). PostgreSQL is only used by the dev profile
# in src/main/resources/application.properties, so tests need no external database.
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Create the schema from the same script used for PostgreSQL, then let Hibernate validate the
# entity against it. Path is relative to the module directory (where Maven runs the tests).
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:db/init.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:4200
