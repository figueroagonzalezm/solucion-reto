server.port=8080
spring.application.name=TestApplication

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_test}
spring.datasource.username=${DB_USER:test}
spring.datasource.password=${DB_PASSWORD:test}

# Schema is managed by db/init.sql; Hibernate only checks that the entity matches it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
