server.port=8080
spring.application.name=TestApplication

spring.datasource.driverClassName=org.postgresql.Driver
# No defaults on purpose: if DB_URL, DB_USER or DB_PASSWORD is not set the application refuses to
# start instead of connecting with guessable credentials. For local development activate the "dev"
# profile (application-dev.properties); `./mvnw spring-boot:run` does it automatically.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Schema is managed by db/init.sql; Hibernate only checks that the entity matches it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Origins allowed to call /api/** from a browser (comma-separated).
# Override with the APP_CORS_ALLOWED_ORIGINS environment variable, e.g. https://app.example.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
