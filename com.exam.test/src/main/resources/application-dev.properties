# Local development only (profile "dev"): defaults for the PostgreSQL started as described in the README.
# Environment variables still win, so a different local database can be used without editing this file.
# Never use these credentials outside a developer machine.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_test}
spring.datasource.username=${DB_USER:test}
spring.datasource.password=${DB_PASSWORD:test}
